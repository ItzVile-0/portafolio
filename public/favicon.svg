<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fondo oscuro redondeado -->
  <rect width="100" height="100" rx="22" fill="#070712"/>
  <!-- Anillo cian exterior -->
  <circle cx="50" cy="50" r="34" fill="none" stroke="#00d4ff" stroke-width="3" opacity="0.35"/>
  <!-- Engranaje (símbolo de ingeniería) -->
  <g transform="translate(50,50)" fill="#00d4ff">
    <!-- Dientes del engranaje -->
    <g>
      <rect x="-3.5" y="-30" width="7" height="11" rx="1.5"/>
      <rect x="-3.5" y="19" width="7" height="11" rx="1.5"/>
      <rect x="-30" y="-3.5" width="11" height="7" rx="1.5"/>
      <rect x="19" y="-3.5" width="11" height="7" rx="1.5"/>
      <rect x="-3.5" y="-30" width="7" height="11" rx="1.5" transform="rotate(45)"/>
      <rect x="-3.5" y="19" width="7" height="11" rx="1.5" transform="rotate(45)"/>
      <rect x="-30" y="-3.5" width="11" height="7" rx="1.5" transform="rotate(45)"/>
      <rect x="19" y="-3.5" width="11" height="7" rx="1.5" transform="rotate(45)"/>
    </g>
    <!-- Cuerpo del engranaje -->
    <circle cx="0" cy="0" r="20"/>
    <!-- Centro hueco (con el color de fondo) -->
    <circle cx="0" cy="0" r="9" fill="#070712"/>
  </g>
  <!-- Símbolo de código "</>" superpuesto en el centro -->
  <text x="50" y="55" font-family="monospace" font-size="13" font-weight="bold"
        fill="#00d4ff" text-anchor="middle">&lt;/&gt;</text>
</svg>

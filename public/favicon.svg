<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#6c63ff"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="24" fill="#0d0d1f"/>
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.5"/>
  <!-- Terminal-style angle bracket + C monogram -->
  <text x="50" y="52" font-family="'Courier New', monospace" font-size="42" font-weight="bold"
        fill="url(#grad)" text-anchor="middle" dominant-baseline="central">&lt;C&gt;</text>
  <!-- Blinking cursor accent -->
  <rect x="72" y="34" width="4" height="32" rx="1" fill="#00d4ff" opacity="0.9"/>
</svg>